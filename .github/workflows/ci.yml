name: App Workflow Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Quality Checks and Unit Tests
  # --------------------------------------------------------------------------
  quality-and-unit-tests:
    name: Quality Checks and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript Type Check
        run: npm run test:types

      - name: Run Jest Unit Tests
        run: npm test

  # --------------------------------------------------------------------------
  # Job 2: Native Android App Build and Compilation Test
  # --------------------------------------------------------------------------
  build-android-app-test:
    name: Android App Build Test
    needs: quality-and-unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Test Expo Android Bundle Export
        run: npx expo export --platform android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foodco-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
